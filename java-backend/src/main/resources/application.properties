server.port=8865
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
seka.admin.username=${SEKA_ADMIN_USERNAME:admin}
seka.admin.password=${SEKA_ADMIN_PASSWORD:admin123}
seka.data-dir=${SEKA_JAVA_DATA_DIR:data-java}

spring.datasource.url=jdbc:h2:file:${seka.data-dir}/seka-java;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
